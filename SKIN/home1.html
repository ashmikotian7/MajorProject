<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skin Cancer Detection</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .animate-bounce-slow {
      animation: bounce 2s infinite;
    }

    @keyframes grow-pulse {
      0%, 100% {
        height: 12px;
      }
      50% {
        height: 18px;
      }
    }

    .animate-grow-pulse {
      animation: grow-pulse 2.5s ease-in-out infinite;
    }

    @keyframes spin-slow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .animate-spin-slow {
      animation: spin-slow 5s linear infinite;
    }
    @keyframes scroll-left {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  @keyframes scroll-left {
  0% {
    transform: translateX(0);
  }
  100% {
    transform: translateX(-50%);
  }
}

@keyframes scroll-right {
  0% {
    transform: translateX(-50%);
  }
  100% {
    transform: translateX(0);
  }
}

.scroll-container {
  overflow: hidden;
  white-space: nowrap;
  position: relative;
  width: 100vw;
}

.scroll-row {
  display: flex;
  white-space: nowrap;
  animation-timing-function: linear;
  animation-iteration-count: infinite;
}

.scroll-left .scroll-row {
  animation: scroll-left 30s linear infinite;
}

.scroll-right .scroll-row {
  animation: scroll-right 30s linear infinite;
}

.scroll-row img {
  height: 300px;
  margin-right: 1rem;
  border-radius: 1rem;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
  transition: transform 0.3s ease;
}


  </style>
</head>
<body class="bg-black text-white font-sans">

  <!-- Navbar -->
  <nav class="flex items-center justify-between px-6 py-4 bg-black">
    <div class="flex items-center space-x-6">
      <!-- Logo -->
      <div class="relative w-20 h-20 bg-black rounded-xl flex items-center justify-center overflow-hidden">
        <!-- Square -->
        <div class="absolute w-8 h-8 bg-blue-500 animate-bounce-slow rounded-sm"></div>
        <!-- Rotating Triangle -->
        <div class="absolute" style="
          width: 0;
          height: 0;
          border-left: 12px solid transparent;
          border-right: 12px solid transparent;
          border-bottom: 20px solid #facc15;
          animation: spin 6s linear infinite;
          top: 10px;
          left: 10px;
        "></div>
        <!-- Rectangle -->
        <div class="absolute w-3 h-12 bg-pink-400 bottom-4 right-4 animate-grow-pulse rounded"></div>
        <!-- Dot -->
        <div class="absolute w-3 h-3 bg-white rounded-full top-2 right-2 animate-ping"></div>
      </div>

      <!-- Nav Links -->
      <a href="#" class="text-white hover:text-red-500 transition-colors duration-300">Home</a>
      <a href="#" class="text-white hover:text-red-500 transition-colors duration-300">Upload Image</a>
      <a href="#" class="text-white hover:text-red-500 transition-colors duration-300">About</a>
      <a href="#" class="text-white hover:text-red-500 transition-colors duration-300">Contact</a>
    </div>

    <!-- Buttons -->
    <div class="flex space-x-4">
      <!-- Sign Up Button -->
      <button class="relative px-6 py-3 bg-red-600 text-white font-semibold rounded-full shadow-lg transition-all duration-300 hover:bg-red-500 hover:scale-105 overflow-hidden group">
        <span class="absolute inset-0 bg-white opacity-10 blur-md group-hover:opacity-20 transition-all duration-300"></span>
        <span class="relative z-10">Sign Up</span>
      </button>
    
      <!-- Sign In Button -->
      <button class="relative px-6 py-3 border-2 border-red-500 text-red-400 font-semibold rounded-full shadow-inner transition-all duration-300 hover:bg-red-500 hover:text-white hover:shadow-red-500/50 hover:scale-105">
        Sign In
      </button>
    </div>
    
  </nav>

  <!-- Hero Section -->
  <section class="flex flex-col items-center justify-center text-center py-32 px-4">
    <h1 class="text-4xl md:text-6xl font-bold mb-4">Get Instant Skin Cancer Detection</h1>
    <p class="text-lg md:text-xl text-gray-300 mb-10">Upload a skin image and receive immediate results on whether it is cancerous or not.</p>
    <div class="flex space-x-4">
      <button class="bg-red-500 hover:bg-black text-white font-semibold px-6 py-3 rounded transition duration-300">
        Upload Image
      </button>
      <button class="border border-red-500 text-red-500 hover:bg-red-500 hover:text-white font-semibold px-6 py-3 rounded transition duration-300">
        Learn More
      </button>
    </div>
    <section class="bg-black py-10 overflow-hidden">
      <!-- Top Row: Scroll Left -->
      <div class="scroll-container scroll-left mb-10">
        <div class="scroll-row">
          <!-- Duplicate images for seamless loop -->
          <img src="image1.jpg" />
          <img src="image2.jpg" />
          <img src="image3.jpg" />
          <img src="image4.jpg" />
          <img src="image5.jpg" />
          <img src="image6.jpg" />
          <img src="image7.jpg" />
          <img src="image8.jpg" />
          <!-- Duplicate again -->
          <img src="image1.jpg" />
          <img src="image2.jpg" />
          <img src="image3.jpg" />
          <img src="image4.jpg" />
          <img src="image5.jpg" />
        </div>
      </div>
    
      <!-- Bottom Row: Scroll Right -->
      <div class="scroll-container scroll-right">
        <div class="scroll-row">
          <!-- Duplicate images for seamless loop -->
          <img src="image9.jpg" />
          <img src="image10.jpg" />
          <img src="image11.jpg" />
          <img src="image12.jpg" />
          <img src="image13.jpg" />
          <img src="image14.jpg" />
          <img src="image15.jpg" />
          <img src="image16.jpg" />
          <!-- Duplicate again -->
          <img src="image9.jpg" />
          <img src="image10.jpg" />
          <img src="image11.jpg" />
          <img src="image12.jpg" />
          <img src="image13.jpg" />
        </div>
      </div>
    </section>
    
  <script>
    function rotateImages(className, reverse = false) {
      const container = document.querySelector('.' + className);
      const images = container.querySelectorAll('img');
      let index = 0;
  
      setInterval(() => {
        images.forEach(img => img.style.opacity = '0');
        images[index].style.opacity = '1';
        index = reverse ? (index - 1 + images.length) % images.length
                        : (index + 1) % images.length;
      }, 3000);
    }
  
    rotateImages('top-slider');           // normal direction
    rotateImages('bottom-slider', true); // reverse direction
  </script>
  

</body>
</html>
